<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTS Mohni Techni Service – Votre avis</title><meta name="robots" content="noindex">
<style>
:root{--bg:#0b0b10;--carte:#16161f;--bord:#2a2a36;--txt:#f3f3f5;--doux:#a9a9b6;--rouge:#e8432b;--vert:#25d366;--or:#f5b400}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:Lato,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.4;min-height:100vh}
header{background:#101017;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--rouge)}
header b{font-size:18px;letter-spacing:.02em}header b span{color:var(--rouge)}
.lang{display:flex;gap:4px}.lang button{background:none;border:1px solid var(--bord);color:var(--doux);border-radius:8px;padding:5px 9px;font:inherit;font-size:14px;cursor:pointer}.lang button.on{border-color:var(--rouge);color:#fff}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;line-height:1.2;margin-bottom:6px}.intro{color:var(--doux)}
.info{background:var(--carte);border:1px solid var(--bord);border-left:4px solid var(--rouge);border-radius:10px;padding:10px 14px;margin:14px 0 6px;color:var(--doux);font-size:15px}.info b{color:var(--txt)}
.q{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:12px 14px;margin-top:12px}
.q .t{font-weight:700;margin-bottom:8px}
.et{display:flex;gap:6px}.et button{flex:1;background:none;border:2px solid var(--bord);border-radius:10px;color:var(--doux);font-size:26px;line-height:1;padding:8px 0;cursor:pointer}
.et button.on{color:var(--or);border-color:var(--or);background:#2a2410}
.leg{display:flex;justify-content:space-between;color:var(--doux);font-size:12px;margin-top:4px}
input,textarea{width:100%;background:var(--carte);border:2px solid var(--bord);border-radius:12px;color:var(--txt);font:inherit;padding:12px;margin-top:6px}
textarea{min-height:90px;resize:vertical}input:focus,textarea:focus{outline:none;border-color:var(--rouge)}
label{display:block;color:var(--doux);font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin-top:18px}
.envoyer{display:flex;align-items:center;justify-content:center;width:100%;margin-top:22px;background:var(--vert);color:#06210f;border:0;border-radius:14px;padding:17px;font:inherit;font-size:19px;font-weight:800;cursor:pointer}
.envoyer:disabled{opacity:.5}
#msg{color:#ff8a7a;margin-top:10px;min-height:20px}
.dp{color:var(--doux);font-size:13px;margin-top:14px}.dp a{color:var(--doux)}
#ok{display:none;text-align:center;padding-top:30px}#ok h1{margin-bottom:10px}
.google{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;background:#fff;color:#1f1f1f;border-radius:14px;padding:15px 20px;font-weight:800;text-decoration:none}
</style></head><body>
<header><b>MTS <span>Swiss Precision</span></b><div class="lang"><button data-l="fr" class="on">FR</button><button data-l="de">DE</button></div></header>
<main id="main">
<h1 data-t="titre"></h1><p class="intro" data-t="intro"></p>
<div class="info" id="info" style="display:none"></div>
<div id="qs"></div>
<label data-t="qc"></label><textarea id="com"></textarea>
<label data-t="qn"></label><input id="cli" autocomplete="organization">
<button class="envoyer" id="go"></button><div id="msg"></div>
<p class="dp" data-t="dp"></p>
</main>
<div id="ok"><main><h1 data-t="merci"></h1><p class="intro" id="okTxt"></p><a class="google" id="gl" href="https://search.google.com/local/writereview?placeid=ChIJV_QmYL222G8RIqakckVYMjs" target="_blank" rel="noopener" style="display:none">★★★★★ <span data-t="google"></span></a></main></div>
<script>
const TXT={
 fr:{titre:"Votre avis sur notre intervention",intro:"4 questions, moins d'une minute. Vos réponses nous aident à améliorer notre service.",
  q:["Rapidité de réponse et d'intervention","Qualité du travail (la machine fonctionne bien)","Clarté du rapport et de la facture","Recommanderiez-vous MTS ?"],
  bas:"Pas satisfait",haut:"Très satisfait",qc:"Un commentaire, une remarque ? (facultatif)",qn:"Entreprise (facultatif)",envoyer:"Envoyer mon avis",envoi:"Envoi en cours…",
  manque:"Merci de donner une note aux 4 questions.",erreur:"L'envoi n'a pas marché. Vous pouvez répondre directement à notre e-mail ou écrire à info@mt-s.ch.",
  merci:"Merci beaucoup !",okBon:"Votre avis est bien reçu. Si vous avez 30 secondes, un avis sur Google nous aiderait beaucoup :",okBas:"Votre avis est bien reçu. Nous allons vous contacter pour en parler et nous améliorer.",
  google:"Laisser un avis Google",rap:"Rapport",dp:'Vos réponses servent uniquement à améliorer notre service. <a href="https://mt-s.ch/confidentialit%C3%A9" target="_blank" rel="noopener">Protection des données</a>'},
 de:{titre:"Ihre Meinung zu unserem Einsatz",intro:"4 Fragen, weniger als eine Minute. Ihre Antworten helfen uns, unseren Service zu verbessern.",
  q:["Schnelligkeit von Antwort und Einsatz","Qualität der Arbeit (die Maschine läuft gut)","Verständlichkeit von Bericht und Rechnung","Würden Sie MTS weiterempfehlen?"],
  bas:"Nicht zufrieden",haut:"Sehr zufrieden",qc:"Ein Kommentar, eine Bemerkung? (freiwillig)",qn:"Firma (freiwillig)",envoyer:"Bewertung senden",envoi:"Wird gesendet…",
  manque:"Bitte bewerten Sie alle 4 Fragen.",erreur:"Das Senden hat nicht funktioniert. Sie können direkt auf unsere E-Mail antworten oder an info@mt-s.ch schreiben.",
  merci:"Herzlichen Dank!",okBon:"Ihre Bewertung ist angekommen. Wenn Sie 30 Sekunden haben, würde uns eine Google-Bewertung sehr helfen:",okBas:"Ihre Bewertung ist angekommen. Wir melden uns bei Ihnen, um darüber zu sprechen und uns zu verbessern.",
  google:"Google-Bewertung abgeben",rap:"Bericht",dp:'Ihre Antworten dienen nur der Verbesserung unseres Services. <a href="https://mt-s.ch/de/datenschutz" target="_blank" rel="noopener">Datenschutz</a>'}};
const P=new URLSearchParams(location.search); let L=(P.get("l")||P.get("lang")||"fr").toLowerCase().startsWith("de")?"de":"fr";
const CLI=(P.get("c")||"").slice(0,120), SR=(P.get("sr")||"").slice(0,40); const N=[0,0,0,0];
const $=s=>document.querySelector(s);
function rendre(){const T=TXT[L];document.documentElement.lang=L;document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
 document.querySelectorAll("[data-t]").forEach(e=>{const v=T[e.dataset.t];if(v!==undefined)e.innerHTML=v;});
 $("#qs").innerHTML=T.q.map((q,i)=>`<div class="q"><div class="t">${i+1}. ${q}</div><div class="et">${[1,2,3,4,5].map(n=>`<button type="button" data-q="${i}" data-n="${n}" class="${N[i]>=n?"on":""}" aria-label="${n}/5">★</button>`).join("")}</div><div class="leg"><span>${T.bas}</span><span>${T.haut}</span></div></div>`).join("");
 document.querySelectorAll(".et button").forEach(b=>b.onclick=()=>{N[+b.dataset.q]=+b.dataset.n;rendre();});
 const inf=[CLI,SR?T.rap+" "+SR:""].filter(Boolean).join(" · ");$("#info").style.display=inf?"block":"none";$("#info").innerHTML=inf?"<b>"+inf.replace(/[<>&]/g,"")+"</b>":"";
 $("#cli").closest("main").querySelector("[data-t=qn]").style.display=$("#cli").style.display=CLI?"none":"block";
 $("#go").textContent=T.envoyer;}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;rendre();});
$("#go").onclick=async()=>{const T=TXT[L];if(N.some(n=>!n)){$("#msg").textContent=T.manque;return;}
 const moy=(N.reduce((a,b)=>a+b,0)/4), cli=(CLI||$("#cli").value.trim()||"(non indiqué)").slice(0,120);
 const fd=new FormData();fd.append("form-name","panne");
 fd.append("subject","⭐ Satisfaction · "+cli+" · "+moy.toFixed(1).replace(".",",")+"/5");
 fd.append("client",cli);fd.append("machine",SR||"–");
 fd.append("etat","Rapidité "+N[0]+" · Qualité "+N[1]+" · Rapport "+N[2]+" · Recommande "+N[3]+" · Moyenne "+moy.toFixed(2));
 fd.append("type","Satisfaction");fd.append("langue",L==="de"?"Deutsch":"Français");fd.append("commentaire",$("#com").value.trim().slice(0,1000)||"–");fd.append("pot","");
 const go=$("#go");go.disabled=true;go.textContent=T.envoi;$("#msg").textContent="";
 try{await fetch("https://mts-panne.netlify.app/",{method:"POST",body:fd,mode:"no-cors"});
  $("#main").style.display="none";$("#ok").style.display="block";$("#okTxt").textContent=moy>=4?T.okBon:T.okBas;$("#gl").style.display=moy>=4?"inline-flex":"none";window.scrollTo(0,0);
 }catch(e){$("#msg").textContent=T.erreur;go.disabled=false;go.textContent=T.envoyer;}};
rendre();
</script></body></html>
